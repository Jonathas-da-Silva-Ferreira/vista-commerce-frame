<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The static <title> and description here act as fallbacks for crawlers
      that don't execute JavaScript (LinkedIn, Slack, Facebook). Per-route
      pages override these via react-helmet-async for Googlebot.
      We intentionally do NOT include a static <link rel="canonical"> here
      because every route sets its own canonical and two canonicals would
      cancel each other out.
    -->
    <title>Nexora — Your modern online marketplace</title>
    <meta name="description" content="Nexora is a modern online marketplace. Shop electronics, fashion, home and more with transparent shipping and seller ratings." />
    <meta name="author" content="Nexora" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/b29674e7-732d-4780-b855-d1329bf41f77/id-preview-07e8112d--0e39dc88-129e-4a05-8ff7-b5e787d38669.lovable.app-1777922374750.png" />

    <meta property="og:title" content="Nexora — Your modern online marketplace" />

    <meta name="twitter:description" content="Modern marketplace. Shop electronics, fashion, home and more with transparent shipping." />
